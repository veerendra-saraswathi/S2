name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, policies, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same image the local stack uses: PostgreSQL 18 + PostGIS + TimescaleDB.
        image: timescale/timescaledb-ha:pg18-ts2.30
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      S2_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres_ci@localhost:5432/postgres
      S2_TEST_APP_PASSWORD: s2_app_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Policy tests
        run: opa test policies -v
      - name: Tests
        run: uv run pytest

  ui:
    name: Workshop UI (tests, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter workshop-ui test
      - run: pnpm --filter workshop-ui build

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose/docker-compose.yml config -q
