# S2 local development stack.
#
#   make up      build and start everything, wait for the API
#   make seed    apply the ontology packs and create demo objects
#   make sim     start the telemetry simulator (compose profile `sim`)
#   make down    stop;  make nuke  also deletes the data volumes
#
# Every credential below is a local-only default. Override them in
# deploy/docker-compose/.env (git-ignored; see .env.example). Nothing here is fit for
# a shared or internet-facing environment: Kafka and the databases are plaintext. MQTT
# requires a login and holds every client to an ACL; gateways use TLS on 8883 (see
# mosquitto/mosquitto.conf). `make up` makes the broker's certificate and passwords.
#
# Image tags are parameterised so a bump is a one-line change in .env.

name: s2

x-postgres: &postgres
  # One image for both databases: PostgreSQL 18 with PostGIS and TimescaleDB,
  # published for amd64 and arm64.
  image: ${S2_PG_IMAGE:-timescale/timescaledb-ha:pg18-ts2.30}
  restart: unless-stopped
  # A small init as PID 1, not postgres. Without it, a healthcheck that times out leaves its
  # pg_isready orphaned, the orphan is handed to PID 1, and when it exits nonzero (2, "no
  # response", exactly when the server is slow) postgres takes it for a crashed backend and
  # restarts every backend into crash recovery. Seen twice in TimescaleDB under load.
  init: true
  healthcheck:
    # Probe over TCP, not the Unix socket. On first start the image runs its init
    # scripts against a temporary server that listens on the socket only; a socket
    # probe reports "healthy" during that phase and dependants then fail to connect.
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 30

x-s2-env: &s2-env
  S2_ENV: dev
  S2_LOG_LEVEL: ${S2_LOG_LEVEL:-INFO}
  # The services connect as s2_app, a non-owner role, so row-level security applies.
  S2_DATABASE_URL: postgresql+psycopg://s2_app:${S2_APP_DB_PASSWORD:-s2_app_dev}@postgres:5432/s2
  S2_TELEMETRY_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres_dev}@timescaledb:5432/telemetry
  S2_KAFKA_BOOTSTRAP: kafka:9092
  S2_MQTT_URL: mqtt://mqtt:1883
  S2_OPA_URL: http://opa:8181
  # Tokens are minted for the issuer the browser sees (localhost); signing keys and
  # tokens for the CLI are fetched over the compose network. Mixing the two up is the
  # classic local-OIDC failure, so they are spelled out.
  S2_OIDC_ISSUER: http://localhost:8080/realms/s2
  S2_OIDC_JWKS_URL: http://keycloak:8080/realms/s2/protocol/openid-connect/certs
  S2_OIDC_TOKEN_URL: http://keycloak:8080/realms/s2/protocol/openid-connect/token
  S2_OIDC_AUDIENCE: s2-api

services:
  # ------------------------------------------------------------------ storage
  postgres:
    # Ontology store (schema `ontology`, PostGIS) and Keycloak's database.
    <<: *postgres
    container_name: s2-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: s2
      S2_APP_DB_PASSWORD: ${S2_APP_DB_PASSWORD:-s2_app_dev}
      S2_EXECUTOR_DB_PASSWORD: ${S2_EXECUTOR_DB_PASSWORD:-s2_executor_dev}
    ports: ["5432:5432"]
    volumes:
      - pg-ontology:/home/postgres/pgdata
      # First start only: creates roles s2_app and s2_executor, database `keycloak`, extension postgis.
      - ./initdb/ontology:/docker-entrypoint-initdb.d:ro

  timescaledb:
    # Telemetry store (schema `telemetry`, hypertables).
    <<: *postgres
    container_name: s2-timescaledb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: telemetry
    ports: ["5433:5432"]
    volumes:
      - pg-telemetry:/home/postgres/pgdata
      # First start only: the ingestion service's own schema file.
      - ../../services/ingestion-connectors/sql:/docker-entrypoint-initdb.d:ro

  object-store:
    # S3 API for the lakehouse and inspection media. SeaweedFS (Apache-2.0) stands in
    # for MinIO, whose community edition is no longer published. Provisioned now so the
    # stack matches the target architecture; its first consumer is the Phase 2 pipeline
    # orchestrator. Access keys: ./seaweedfs/s3.json.
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.48}
    container_name: s2-object-store
    # Each bucket needs volumes of its own. The defaults (8 volumes, 30 GB each, sized
    # against free disk) leave room for about one bucket; small volumes and a high cap
    # let the lakehouse and inspection-media buckets coexist on a laptop.
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=100", "-master.volumeSizeLimitMB=256",
              "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    restart: unless-stopped
    ports: ["8333:8333"]
    volumes:
      - object-store:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # ---------------------------------------------------------------- messaging
  mqtt:
    # Stand-in for the Samanvaya 0.5 / 1 telemetry bus. Any MQTT 3.1.1 / 5 broker works.
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2}
    container_name: s2-mqtt
    restart: unless-stopped
    # Plain MQTT for this machine only; TLS for everything else.
    ports: ["127.0.0.1:1883:1883", "8883:8883"]
    entrypoint: ["/bin/sh", "/mosquitto/start.sh"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/start.sh:/mosquitto/start.sh:ro
      - ./mosquitto/secrets:/mosquitto/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u s2-monitor -P \"$$(cat /mosquitto/secrets/s2-monitor.password)\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # Single-node KRaft (Kafka 4 has no ZooKeeper). The durable, replayable log between
    # the edge and every store: reprocessing and lineage both depend on it.
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    container_name: s2-kafka
    restart: unless-stopped
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 48
      start_period: 90s

  kafka-topics:
    # One-shot: creates the telemetry topics with their partitions (kafka/topics.sh), so
    # the broker does not auto-create s2.telemetry.raw with one. S2_TELEMETRY_PARTITIONS.
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    container_name: s2-kafka-topics
    restart: "no"
    entrypoint: ["/bin/sh", "/s2/topics.sh"]
    environment:
      TELEMETRY_PARTITIONS: ${S2_TELEMETRY_PARTITIONS:-4}
    volumes:
      - ./kafka/topics.sh:/s2/topics.sh:ro
    depends_on:
      kafka: {condition: service_healthy}

  # ------------------------------------------------------ identity and policy
  keycloak:
    # Admin console: http://localhost:8080  (admin / KEYCLOAK_ADMIN_PASSWORD)
    # Realm `s2` with its clients, roles and dev users is imported from ./keycloak.
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.2}
    container_name: s2-keycloak
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8080:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # The image ships no curl or wget, so probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          while read -r line <&3; do case "$$line" in *UP*) exit 0;; esac; done; exit 1
      interval: 10s
      timeout: 10s
      retries: 72
      start_period: 120s

  opa:
    # Serves ../../policies. --watch reloads Rego on save. Decision logs go to stdout;
    # their ids are recorded in ontology.audit_log.policy_decision_id.
    image: openpolicyagent/opa:${OPA_VERSION:-1.20.2}
    container_name: s2-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "--set=decision_logs.console=true", "--watch", "/policies"]
    restart: unless-stopped
    ports: ["8181:8181"]
    volumes:
      - ../../policies:/policies:ro

  # ------------------------------------------------------------- S2 services
  migrate:
    # Alembic runs as the schema owner, then exits. The API never holds DDL rights.
    build: &ontology-build
      context: ../..
      dockerfile: services/ontology-engine/Dockerfile
    image: s2/ontology-engine:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      S2_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres_dev}@postgres:5432/s2
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  ontology-engine:
    # API: http://localhost:8000   interactive docs: http://localhost:8000/docs
    build: *ontology-build
    image: s2/ontology-engine:dev
    container_name: s2-ontology-engine
    command:
      - uvicorn
      - s2_ontology.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/services/ontology-engine/src
      - --reload-dir=/app/packages/s2-common/src
    restart: unless-stopped
    environment: *s2-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      timescaledb: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      opa: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    develop:
      # `docker compose watch`: edit on the host, the container reloads.
      watch:
        - {action: sync, path: ../../services/ontology-engine/src, target: /app/services/ontology-engine/src}
        - {action: sync, path: ../../packages/s2-common/src, target: /app/packages/s2-common/src}
        - {action: sync, path: ../../ontologies, target: /app/ontologies}
        - {action: rebuild, path: ../../uv.lock}

  mqtt-bridge:
    # MQTT topic tree -> Kafka topic s2.telemetry.raw, validated against the contract.
    build: &ingest-build
      context: ../..
      dockerfile: services/ingestion-connectors/Dockerfile
    image: s2/ingestion-connectors:dev
    container_name: s2-mqtt-bridge
    command: ["python", "-m", "s2_ingest.mqtt_bridge"]
    restart: unless-stopped
    environment:
      <<: *s2-env
      S2_MQTT_USERNAME: s2-bridge
      S2_MQTT_PASSWORD_FILE: /run/secrets/mqtt_bridge_password
    secrets: [mqtt_bridge_password]
    depends_on:
      mqtt: {condition: service_healthy}
      kafka-topics: {condition: service_completed_successfully}

  timeseries-sink: &timeseries-sink
    # Kafka s2.telemetry.raw -> TimescaleDB telemetry.reading / telemetry.position.
    build: *ingest-build
    image: s2/ingestion-connectors:dev
    container_name: s2-timeseries-sink
    command: ["python", "-m", "s2_ingest.timeseries_sink"]
    restart: unless-stopped
    environment: *s2-env
    depends_on:
      kafka-topics: {condition: service_completed_successfully}
      timescaledb: {condition: service_healthy}

  timeseries-sink-2:
    # A second sink in the same consumer group: Kafka shares the telemetry topic's
    # partitions between the two, so storage is written by two processes, each with its
    # own connection. One object's readings stay on one partition and so with one sink.
    <<: *timeseries-sink
    container_name: s2-timeseries-sink-2

  workshop-ui:
    # The operator workspace: http://localhost:5173. Sign in with a dev user (Keycloak
    # client s2-workshop). /api is proxied to the engine, so no CORS is involved.
    build:
      context: ../..
      dockerfile: apps/workshop-ui/Dockerfile
    image: s2/workshop-ui:dev
    container_name: s2-workshop-ui
    restart: unless-stopped
    ports: ["5173:5173"]
    environment:
      S2_API_URL: http://ontology-engine:8000
    depends_on:
      ontology-engine: {condition: service_healthy}

  agent:
    # The fleet agent: investigates triage items with a local model and proposes actions
    # for a person to approve. Opt-in (profile agents): it needs Ollama running on this
    # Mac with the model pulled (`ollama pull llama3.1`). make agent-once / agent-up.
    profiles: [agents]
    build:
      context: ../..
      dockerfile: services/agent-runtime/Dockerfile
    image: s2/agent:dev
    container_name: s2-agent
    restart: unless-stopped
    environment:
      <<: *s2-env
      S2_ENGINE_API_URL: http://ontology-engine:8000
      S2_AGENT_CLIENT_ID: s2-agent
      S2_AGENT_CLIENT_SECRET: ${S2_AGENT_CLIENT_SECRET:-s2-agent-dev-secret}
      S2_OLLAMA_URL: ${S2_OLLAMA_URL:-http://host.docker.internal:11434}
      S2_OLLAMA_MODEL: ${S2_OLLAMA_MODEL:-llama3.1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ontology-engine: {condition: service_healthy}

  action-executor:
    # Delivers the write-backs that governed actions queue in the outbox. With the default
    # connectors (type "log") it records each one and reports success; point a connector at
    # a real system with S2_CONNECTORS (see services/action-executor/README.md).
    build:
      context: ../..
      dockerfile: services/action-executor/Dockerfile
    image: s2/action-executor:dev
    container_name: s2-action-executor
    command: ["python", "-m", "s2_executor"]
    restart: unless-stopped
    environment:
      <<: *s2-env
      # Its own role: BYPASSRLS, rights on the outbox and audit log only. Not s2_app.
      S2_EXECUTOR_DATABASE_URL: postgresql+psycopg://s2_executor:${S2_EXECUTOR_DB_PASSWORD:-s2_executor_dev}@postgres:5432/s2
    depends_on:
      migrate: {condition: service_completed_successfully}

  pipelines:
    # The lakehouse: Iceberg tables (catalog in Postgres schema `lakehouse`, files on the
    # object store) and Dagster, which syncs them into the ontology through the API.
    # UI: http://localhost:3000 (make pipelines-ui). CLI: make lakehouse ARGS="...".
    profiles: [pipelines]
    build:
      context: ../..
      dockerfile: services/pipeline-orchestrator/Dockerfile
    image: s2/pipelines:dev
    container_name: s2-pipelines
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      <<: *s2-env
      S2_CATALOG_URI: postgresql+psycopg://s2_app:${S2_APP_DB_PASSWORD:-s2_app_dev}@postgres:5432/s2?options=-csearch_path%3Dlakehouse
      S2_WAREHOUSE: s3://s2-lakehouse
      S2_S3_ENDPOINT: http://object-store:8333
      S2_ENGINE_API_URL: http://ontology-engine:8000
      # Its own identity: the s2-pipeline service account (client credentials), whose
      # tokens say s2_actor_type=service, so audit entries show the pipeline, not a person.
      # A stack created before it existed needs `make dev-pipeline-client` once.
      S2_PIPELINE_CLIENT_ID: s2-pipeline
      S2_PIPELINE_CLIENT_SECRET: ${S2_PIPELINE_CLIENT_SECRET:-s2-pipeline-dev-secret}
    volumes:
      - dagster-home:/var/lib/dagster
    depends_on:
      ontology-engine: {condition: service_healthy}
      object-store: {condition: service_started}

  telemetry-sim:
    # Publishes synthetic UAV / UGV telemetry so the slice runs with no hardware.
    profiles: ["sim"]
    build:
      context: ../..
      dockerfile: tools/telemetry-sim/Dockerfile
    image: s2/telemetry-sim:dev
    container_name: s2-telemetry-sim
    restart: unless-stopped
    environment:
      S2_MQTT_URL: mqtt://mqtt:1883
      S2_MQTT_USERNAME: s2-sim
      S2_MQTT_PASSWORD_FILE: /run/secrets/mqtt_sim_password
      S2_SIM_FLEET: ${S2_SIM_FLEET:-3}
      S2_SIM_ROBOTS: ${S2_SIM_ROBOTS:-1}
      S2_SIM_RATE_HZ: ${S2_SIM_RATE_HZ:-1}
    secrets: [mqtt_sim_password]
    depends_on:
      mqtt: {condition: service_healthy}

# MQTT passwords, made by mosquitto/setup.sh. Each service sees only its own.
secrets:
  mqtt_bridge_password:
    file: ./mosquitto/secrets/s2-bridge.password
  mqtt_sim_password:
    file: ./mosquitto/secrets/s2-sim.password

volumes:
  pg-ontology:
  pg-telemetry:
  object-store:
  kafka:
  dagster-home:
