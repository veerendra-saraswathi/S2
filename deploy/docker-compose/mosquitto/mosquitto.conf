# Local development broker. Every client logs in and is held to ./acl on both listeners.
# The certificate and passwords are made by setup.sh (make up runs it) into ./secrets.
#
#   1883  plain MQTT, for services inside the Compose network. Published on the host's
#         127.0.0.1 only, so plain text never leaves this machine.
#   8883  MQTT over TLS, for gateways: mqtts://<host>:8883 with secrets/ca.crt trusted.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883 0.0.0.0

listener 8883 0.0.0.0
certfile /mosquitto/run/server.crt
keyfile /mosquitto/run/server.key
cafile /mosquitto/run/ca.crt
tls_version tlsv1.2
require_certificate false
