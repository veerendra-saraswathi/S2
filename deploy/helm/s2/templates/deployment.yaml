apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s2.fullname" . }}-ontology-engine
  labels:
    {{- include "s2.labels" . | nindent 4 }}
    app.kubernetes.io/component: ontology-engine
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "s2.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s2.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ontology-engine
          image: {{ include "s2.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "s2_ontology.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "s2.commonEnv" . | nindent 12 }}
            - name: S2_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.appUrlKey | quote }}
            {{- if .Values.telemetry.existingSecret }}
            - name: S2_TELEMETRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.existingSecret | quote }}
                  key: {{ .Values.telemetry.urlKey | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
