[project]
name = "s2-common"
version = "0.1.0"
description = "Shared building blocks for S2 services: settings, OIDC token verification, OPA client, logging."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_common"]
