[project]
name = "s2-executor"
version = "0.1.0"
description = "S2 action executor: delivers the write-backs that governed actions queue in the outbox."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "s2-common",
]

[tool.uv.sources]
s2-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_executor"]
