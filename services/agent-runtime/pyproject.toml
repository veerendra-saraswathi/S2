[project]
name = "s2-agents"
version = "0.1.0"
description = "S2 governed agents: investigate triage items with a local model and propose actions for a person to approve."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "s2-common",
]

[tool.uv.sources]
s2-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_agents"]
