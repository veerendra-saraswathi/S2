[project]
name = "s2-ingest"
version = "0.1.0"
description = "S2 ingestion: MQTT to Kafka bridge and Kafka to TimescaleDB sink."
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "s2-common",
]

[tool.uv.sources]
s2-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_ingest"]
