[project]
name = "s2-pipelines"
version = "0.1.0"
description = "S2 lakehouse: Iceberg datasets, their sync into the ontology, branches, Dagster orchestration."
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pyiceberg[sql-postgres,pyarrow]>=0.12",
    "s2-common",
]

[tool.uv.sources]
s2-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_pipelines"]
