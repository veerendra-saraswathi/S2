[project]
name = "s2-telemetry-sim"
version = "0.1.0"
description = "Publishes synthetic UAV / UGV telemetry over MQTT so the S2 slice runs without hardware."
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_telemetry_sim"]
